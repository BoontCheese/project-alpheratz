<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starlink Tour | Tiket Pesawat, Hotel, Paket Wisata & Sewa Mobil. Murah, Aman, Nyaman </title>

    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="header">
        <nav class="navbar">

            <h1>
                Starlink Tour
            </h1>

            <ul class="nav-links">
                <li><a href="#">Beranda</a></li>
                <li><a href="#">Tiket Pesawat</a></li>
                <li><a href="#">Hotel</a></li>
                <li><a href="#">Paket Wisata</a></li>
                <li><a href="#">Sewa Mobil</a></li> 
                <li><a href="#">Promo</a></li>
                <li><a href="#">Kontak</a></li>
            </ul>

            <div class="auth-buttons">
                <a href="#">Masuk</a>
                <a href="#">Daftar</a>

            </div>

        </nav>

    </header>

    <main>

    <!-- HERO -->
    <section class="hero">

        <div class="hero-content">

            <h2>
                Perjalanan Lebih Mudah,
                Harga Lebih Bersahabat.
            </h2>

            <p>
                Pesan Tiket Pesawat, Hotel,
                Paket Wisata dan Sewa Mobil
                dalam satu sentuhan.
            </p>

            <a href="#" class="btn-primary">
                Mulai Cari
            </a>

        </div>

        <div class="hero-image">

            <img
                src="assets/images/hero.png"
                alt="Travel Illustration">

        </div>

    </section>

    <!-- Booking Widget -->
<section class="booking-widget">

    <div class="booking-card">

        <div class="booking-tabs">

            <button class="tab active">
                ✈ Pesawat
            </button>

            <button class="tab">
                🏨 Hotel
            </button>

            <button class="tab">
                🧳 Paket Wisata
            </button>

            <button class="tab">
                🚗 Sewa Mobil
            </button>

        </div>

        <div class="booking-content">
            <!-- Flight Form -->
           <form class="flight-form">

    <div class="form-group">

        <label>Dari</label>

        <input
            type="text"
            placeholder="Contoh: Surabaya">

    </div>

    <div class="form-group">

        <label>Ke</label>

        <input
            type="text"
            placeholder="Contoh: Jakarta">

    </div>

    <div class="form-group">

        <label>Tanggal Berangkat</label>

        <input type="date">

    </div>

    <div class="form-group">

        <label>Penumpang</label>

        <select>

            <option>1 Dewasa</option>
            <option>2 Dewasa</option>
            <option>3 Dewasa</option>

        </select>

    </div>

    <button
        type="submit"
        class="btn-primary">

        Cari Tiket

    </button>

</form>

</section>
    <section class="services">

    </section>

    <section class="destinations">

    </section>

    <section class="testimonials">

    </section>

    <section class="youtube">

    </section>

</main>

    <footer>

    </footer>

    <script src="assets/js/script.js"> </script>
</body>
</html>
